spring.application.name=taskflow-api

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/taskflow?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=your-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm-to-work-properly
jwt.expiration=86400000

# AWS S3 Configuration (optional - for reports)
aws.s3.bucket-name=taskflow-reports
aws.region=us-east-1
